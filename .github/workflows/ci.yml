name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Build WASM
        run: cargo build --target wasm32v1-none --release

  bindings:
    name: Bindings up to date
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cache Stellar CLI
        id: cache-stellar-cli
        uses: actions/cache@v4
        with:
          path: ~/.local/stellar-cli/stellar
          key: stellar-cli-28.1.0-${{ runner.os }}-bin

      - name: Install Stellar CLI
        if: steps.cache-stellar-cli.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/stellar-cli
          curl -fsSL -o /tmp/stellar-cli.tar.gz \
            https://github.com/stellar/stellar-cli/releases/download/v28.1.0/stellar-cli-28.1.0-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf /tmp/stellar-cli.tar.gz -C ~/.local/stellar-cli

      - name: Add Stellar CLI to PATH
        run: echo "$HOME/.local/stellar-cli" >> "$GITHUB_PATH"

      - name: Regenerate bindings
        run: ./scripts/generate-bindings.sh

      - name: Fail if the committed bindings are out of date
        run: |
          git diff --exit-code -- bindings/src/index.ts bindings/package.json bindings/README.md bindings/.gitignore || {
            echo "::error::bindings/ doesn't match the current contract — run ./scripts/generate-bindings.sh and commit the result";
            exit 1;
          }

      - name: Install bindings dependencies
        working-directory: bindings
        run: npm install

      - name: Build bindings package
        working-directory: bindings
        run: npm run build
